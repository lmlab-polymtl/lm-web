backend:
  name: github
  repo: lmlab-polymtl/lm-web
  branch: main
media_folder: public/uploads
public_folder: /uploads
publish_mode: editorial_workflow
collections:
  - name: people
    label: People
    folder: src/content/people
    create: true
    slug: '{{slug}}'
    fields:
      - label: Name
        name: name
        widget: string
      - label: Role
        name: role
        widget: string
      - label: Draft
        name: isDraft
        widget: boolean
        default: false
      - label: Affiliation
        name: affiliation
        widget: string
        required: false
      - label: Supervisor
        name: supervisor
        widget: string
        required: false
      - label: Group
        name: group
        widget: select
        options:
          - Faculty
          - Lab Members
          - PhD
          - MSc
          - Alumni
          - Collaborators
      - label: Order
        name: order
        widget: number
        default: 100
      - label: Email
        name: email
        widget: string
        required: false
      - label: ORCID
        name: orcid
        widget: string
        required: false
      - label: Personal website
        name: website
        widget: string
        required: false
      - label: GitHub
        name: github
        widget: string
        required: false
      - label: Twitter / X
        name: twitter
        widget: string
        required: false
      - label: LinkedIn
        name: linkedin
        widget: string
        required: false
      - label: Mila profile
        name: mila
        widget: string
        required: false
      - label: Google Scholar
        name: googleScholar
        widget: string
        required: false
      - label: Image
        name: image
        widget: image
        required: false
      - label: Interests
        name: interests
        widget: list
        default: []
      - label: Projects
        name: projects
        widget: list
        default: []
      - label: Posters
        name: posters
        widget: list
        required: false
        fields:
          - label: Label
            name: label
            widget: string
          - label: URL
            name: url
            widget: string
      - label: Links
        name: links
        widget: list
        required: false
        fields:
          - label: Label
            name: label
            widget: string
          - label: URL
            name: url
            widget: string
      - label: Bio
        name: body
        widget: markdown
  - name: publications
    label: Member publications
    label_singular: Member publications file
    folder: src/content/publications
    create: true
    identifier_field: member
    slug: '{{slug}}'
    summary: '{{member}} — publications'
    fields:
      - label: Member
        name: member
        widget: relation
        collection: people
        search_fields:
          - name
        display_fields:
          - name
        value_field: '{{slug}}'
        hint: One publications file per member. Select the matching profile.
      - label: All publications
        name: publications
        widget: list
        required: false
        default: []
        summary: '{{fields.title}}'
        hint: All papers for this member, with full metadata and display flags, saved together in this one publications file.
        fields:
          - label: Stable paper ID
            name: id
            widget: string
            hint: Use the same ID for a coauthored paper listed by multiple members. Keep it unchanged.
          - label: Show on my profile
            name: showOnProfile
            widget: boolean
            default: true
          - label: Position on my profile
            name: profileOrder
            widget: number
            value_type: int
            default: 100
            hint: Lower numbers first; ties use year then title.
          - label: Title
            name: title
            widget: string
          - label: Year
            name: year
            widget: number
          - label: Venue
            name: venue
            widget: string
          - label: Type
            name: type
            widget: select
            options:
              - Conference
              - Journal
              - Workshop
              - Preprint
              - Thesis
          - label: Authors
            name: authors
            widget: list
            hint: Include every author in published order.
          - label: Award
            name: award
            widget: string
            required: false
          - label: Research streams
            name: researchStreams
            widget: relation
            collection: projects
            multiple: true
            required: false
            default: []
            search_fields:
              - title
            display_fields:
              - title
            value_field: '{{slug}}'
            hint: Select streams whose Featured papers section should include this paper. Independent of archive and homepage flags.
          - label: Selected for homepage
            name: selected
            widget: boolean
            default: false
            hint: Show in the homepage paper section (newest first, up to four). Independent of profiles, streams and archive.
          - label: Source URL
            name: source
            widget: string
            required: false
            hint: Official publisher, DOI, repository or thesis page used to verify the metadata.
          - label: Show on lab publications page
            name: showInLabPublications
            widget: boolean
            default: true
            hint: Turn off for profile-only work such as a pre-lab thesis. Profiles can select either kind.
          - label: Tags
            name: tags
            widget: list
            default: []
          - label: Links
            hint: Use Paper, Code or Slides labels with verified URLs. Omit unavailable resources.
            name: links
            widget: list
            required: false
            fields:
              - label: Label
                name: label
                widget: string
              - label: URL
                name: url
                widget: string
  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    fields:
      - label: Title
        name: title
        widget: string
      - label: Status
        name: status
        widget: select
        options:
          - Active
          - Recruiting
          - Ongoing
          - Archived
      - label: Summary
        name: summary
        widget: text
      - label: Tags
        name: tags
        widget: list
        default: []
      - label: People
        name: people
        widget: list
        default: []
      - label: People count
        name: peopleCount
        widget: number
        default: 1
      - label: Poster
        name: poster
        widget: string
        required: false
      - label: Funding
        name: funding
        widget: string
        required: false
      - label: Featured
        name: featured
        widget: boolean
        default: false
      - label: Links
        name: links
        widget: list
        required: false
        fields:
          - label: Label
            name: label
            widget: string
          - label: URL
            name: url
            widget: string
      - label: Body
        name: body
        widget: markdown
  - name: news
    label: News
    folder: src/content/news
    create: true
    slug: '{{slug}}'
    fields:
      - label: Title
        name: title
        widget: string
      - label: Date
        name: date
        widget: datetime
      - label: Summary
        name: summary
        widget: text
      - label: Link
        name: link
        widget: string
        required: false
  - name: talks
    label: Talks
    folder: src/content/talks
    create: true
    slug: '{{slug}}'
    fields:
      - label: Title
        name: title
        widget: string
      - label: Speaker
        name: speaker
        widget: string
      - label: Date
        name: date
        widget: datetime
      - label: Venue
        name: venue
        widget: string
      - label: Abstract
        name: abstract
        widget: text
      - label: Bio
        name: bio
        widget: text
      - label: Tags
        name: tags
        widget: list
        default: []
      - label: Links
        name: links
        widget: list
        required: false
        fields:
          - label: Label
            name: label
            widget: string
          - label: URL
            name: url
            widget: string
  - name: settings
    label: Site Settings
    files:
      - label: Contact Copy
        name: contact
        file: src/content/settings/contact.md
        fields:
          - label: Email
            name: email
            widget: string
          - label: Office
            name: office
            widget: string
          - label: Prospective Students
            name: prospective_students
            widget: markdown
